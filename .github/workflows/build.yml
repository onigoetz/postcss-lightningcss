name: Node CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# give zero permissions to all jobs by default
permissions: {}

jobs:

  # Run linting only once
  lint: 
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      with:
        persist-credentials: false
    - name: Use Node.js
      uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
      with:
        node-version: 22.x
        cache: 'yarn'
    - name: Yarn install
      run: yarn install
    - name: Lint
      run: yarn lint

  # ─── Job 1: runs PR code, NO secrets, NO write permissions ───────────────
  build:
    strategy:
      matrix:
        os: [ubuntu-latest]
        node-version: [20.x, 22.x, 24.x]
        include:
        - os: macos-latest
          node-version: 20.x
        # TODO : add Windows build
        #- os: windows-latest
        #  node-version: 20.x
          
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      with:
        persist-credentials: false
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'yarn'
        package-manager-cache: false
    - name: Yarn install
      run: yarn install
    - name: Test
      run: yarn test:ci
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
      if: matrix.node-version == '20.x'
      with:
        name: reports-${{ matrix.os }}-${{ matrix.node-version }}
        retention-days: 1
        path: |
          **/coverage/lcov.info
          **/coverage/sonar-report.xml
          !node_modules/**

  # ─── Job 2: uploads to SonarCloud using secrets ─────────────────────────
  # Only runs for pushes and PRs from branches of this repository, never for forks
  # or dependency bots (Dependabot has no access to Actions secrets)
  static_analysis:
    name: "🔬 Static Analysis"
    needs: build
    runs-on: ubuntu-latest
    if: >-
      success() && (
        github.event_name == 'push' || (
          github.event.pull_request.head.repo.full_name == github.repository &&
          github.event.pull_request.user.login != 'dependabot[bot]' &&
          github.event.pull_request.user.login != 'renovate[bot]'
        )
      )
    permissions:
      contents: read
    steps:
    # Commit is needed to check coverage files against content
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      with:
        # Disabling shallow clone is needed by SonarQube
        fetch-depth: 0
        persist-credentials: false
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
      with:
        pattern: reports-*
        path: __reports
    - run: find __reports -type f
    - name: Collect Sonar report paths
      id: sonar_reports
      run: |
        test_reports=$(find __reports -name "sonar-report.xml" | sort | paste -sd, -)
        # The scanner action splits args on whitespace, only allow plain paths
        if [[ ! "$test_reports" =~ ^[A-Za-z0-9._/,-]+$ ]]; then
          echo "::error::Unexpected test report paths: $test_reports"
          exit 1
        fi
        echo "test_reports=$test_reports" >> "$GITHUB_OUTPUT"
        echo "project_version=$(git tag -l --sort=-creatordate --format='%(refname:short)' | head -n1)" >> "$GITHUB_OUTPUT"
    - name: SonarCloud Scan
      uses: SonarSource/sonarqube-scan-action@c7ee0f9df90b7aa20e8dcf9695dcfe2e7da5b4f2 # v7
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      with:
        args: >
          -Dsonar.host.url=https://sonarcloud.io
          -Dsonar.testExecutionReportPaths=${{ steps.sonar_reports.outputs.test_reports }}
          -Dsonar.projectVersion=${{ steps.sonar_reports.outputs.project_version }}
